<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Glowing Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)" />

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="93" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">
    LAYOUT ABNT 2 (BR)
  </text>

  <!-- Title & Subtitle -->
  <text x="80" y="155" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Teclado ABNT 2 Imprimível
  </text>
  <text x="80" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Gerador e editor de teclas para impressão A4 com guias de corte e tamanho real 1:1
  </text>

  <!-- Keyboard Graphic Container -->
  <g transform="translate(80, 240)" filter="url(#shadow)">
    <!-- Paper Sheet Backing -->
    <rect width="1040" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Sheet Header -->
    <rect x="20" y="15" width="1000" height="30" fill="#f8fafc" rx="6"/>
    <text x="35" y="35" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
      FOLHA DE IMPRESSÃO A4 — TECLADO COMPLETO ABNT 2
    </text>
    <text x="1005" y="35" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">
      ESCALA 100% REAL (1:1)
    </text>

    <!-- Row 1 (F-Keys) -->
    <g transform="translate(35, 60)">
      <!-- Key Esc -->
      <rect x="0" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="20" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Esc</text>

      <!-- F1-F12 keys -->
      <rect x="50" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="70" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F1</text>

      <rect x="95" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="115" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F2</text>

      <rect x="140" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="160" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F3</text>

      <rect x="185" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="205" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F4</text>

      <rect x="235" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="255" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F5</text>

      <rect x="280" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="300" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F6</text>

      <rect x="325" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="345" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F7</text>

      <rect x="370" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="390" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F8</text>

      <rect x="420" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="440" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F9</text>

      <rect x="465" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="485" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F10</text>

      <rect x="510" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="530" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F11</text>

      <rect x="555" y="0" width="40" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="575" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">F12</text>

      <!-- PrintScreen, ScrollLock, Pause -->
      <rect x="610" y="0" width="42" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="631" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PrtScn</text>

      <rect x="657" y="0" width="42" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="678" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ScrLk</text>

      <rect x="704" y="0" width="42" height="36" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="725" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Pause</text>
    </g>

    <!-- Row 2 (Numbers) -->
    <g transform="translate(35, 105)">
      <rect x="0" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="20" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">' "</text>

      <rect x="45" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="20" y="20" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="700" transform="translate(45,0) absolute">¹</text>
      <text x="65" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>

      <rect x="90" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="110" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>

      <rect x="135" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="155" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>

      <rect x="180" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="200" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text>

      <rect x="225" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="245" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text>

      <rect x="270" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="290" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text>

      <rect x="315" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="335" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">7</text>

      <rect x="360" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="380" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">8</text>

      <rect x="405" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="425" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">9</text>

      <rect x="450" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="470" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text>

      <rect x="495" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="515" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">-</text>

      <rect x="540" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="560" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">=</text>

      <!-- Backspace -->
      <rect x="585" y="0" width="82" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="626" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Backspace</text>
    </g>

    <!-- Row 3 (QWERTY + ABNT Ç) -->
    <g transform="translate(35, 155)">
      <rect x="0" y="0" width="56" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="28" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tab</text>

      <rect x="61" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="81" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Q</text>

      <rect x="106" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="126" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">W</text>

      <rect x="151" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="171" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">E</text>

      <rect x="196" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="216" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">R</text>

      <rect x="241" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="261" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">T</text>

      <rect x="286" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="306" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Y</text>

      <rect x="331" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="351" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">U</text>

      <rect x="376" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="396" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">I</text>

      <rect x="421" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="441" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">O</text>

      <rect x="466" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="486" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">P</text>

      <rect x="511" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="531" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">`  ´</text>

      <rect x="556" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="576" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">[ {</text>

      <!-- Enter ABNT2 -->
      <rect x="601" y="0" width="66" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="634" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Enter ↵</text>
    </g>

    <!-- Row 4 (ASDFGHJKL Ç) Accentuated -->
    <g transform="translate(35, 205)">
      <rect x="0" y="0" width="68" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="34" y="25" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Fixa / Caps</text>

      <rect x="73" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="93" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text>

      <rect x="118" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="138" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">S</text>

      <rect x="163" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="183" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">D</text>

      <rect x="208" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="228" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">F</text>

      <rect x="253" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="273" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">G</text>

      <rect x="298" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="318" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">H</text>

      <rect x="343" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="363" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">J</text>

      <rect x="388" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="408" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">K</text>

      <rect x="433" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="453" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">L</text>

      <!-- Ç Key Highlights ABNT2 -->
      <rect x="478" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="2"/>
      <text x="498" y="25" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">Ç</text>

      <rect x="523" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="543" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">~ ^</text>

      <rect x="568" y="0" width="40" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="588" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">] }</text>
    </g>

    <!-- Row 5 (Space row) -->
    <g transform="translate(35, 255)">
      <rect x="0" y="0" width="50" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="25" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ctrl</text>

      <rect x="55" y="0" width="45" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="77" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Win</text>

      <rect x="105" y="0" width="45" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="127" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Alt</text>

      <rect x="155" y="0" width="230" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="270" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Espaço / Space</text>

      <!-- Alt Gr (ABNT2 Feature) -->
      <rect x="390" y="0" width="50" height="42" rx="6" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="2"/>
      <text x="415" y="25" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Alt Gr</text>

      <rect x="445" y="0" width="45" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="467" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Win</text>

      <rect x="495" y="0" width="45" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="517" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Menu</text>

      <rect x="545" y="0" width="50" height="42" rx="6" fill="url(#card-grad)" stroke="#27272a" stroke-width="1.5"/>
      <text x="570" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ctrl</text>
    </g>
  </g>
</svg>
